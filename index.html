<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gamewala Receipt Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1100px;margin:30px auto;padding:20px;display:grid;grid-template-columns:380px 1fr;gap:24px}
.card{background:#1d1d1d;border:1px solid #333;border-radius:16px;padding:22px}
h1{margin:0 0 6px;font-size:25px}.sub{color:#aaa;margin-bottom:20px}
label{display:block;color:#bbb;font-size:13px;margin:13px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #444;border-radius:9px;background:#101010;color:#fff;font-size:15px}
textarea{min-height:70px;resize:vertical}
button{width:100%;padding:13px;border:0;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
.primary{background:#ff6b00;color:#fff}.secondary{background:#333;color:#fff}.danger{background:#642020;color:#fff}
.receipt{background:#fff;color:#111;max-width:680px;margin:auto;padding:42px;border-radius:4px;min-height:760px}
.brand{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:18px}
.logo{font-size:28px;font-weight:900;letter-spacing:1px}.tag{font-size:11px;color:#666;margin-top:3px}
.meta{text-align:right;font-size:12px;color:#555}
.title{text-align:center;margin:30px 0 25px;font-size:24px;font-weight:800;letter-spacing:2px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ddd;font-size:14px}
.row strong{font-weight:700}.total{font-size:22px;font-weight:900;border-bottom:0;padding-top:18px}
.note{background:#f4f4f4;padding:13px;border-radius:6px;margin-top:24px;font-size:12px;white-space:pre-wrap}
.footer{text-align:center;border-top:1px solid #ddd;margin-top:35px;padding-top:15px;color:#666;font-size:11px}
.empty{color:#888;text-align:center;padding:100px 20px}
.actions{display:flex;gap:10px}.actions button{flex:1}
@media(max-width:850px){.wrap{grid-template-columns:1fr}.receipt{max-width:none}}
@media print{
 body{background:#fff}.wrap{display:block;margin:0;padding:0}.form{display:none!important}
 .card{border:0;padding:0}.receipt{max-width:none;min-height:auto;border-radius:0;padding:35px;box-shadow:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card form">
    <h1>Gamewala Receipt Generator</h1>
    <div class="sub">Create a clean customer receipt and print/save it as PDF.</div>

    <label>Order Number</label><input id="order" placeholder="GW-1001">
    <label>Date</label><input id="date" type="date">
    <label>Customer Name</label><input id="customer" placeholder="Customer name">
    <label>Customer Email</label><input id="email" type="email" placeholder="customer@example.com">
    <label>Product / Game</label><input id="product" placeholder="FC 26 — Steam PC Account">
    <label>Platform</label><input id="platform" placeholder="PC / Steam">
    <label>Price (BDT)</label><input id="price" type="number" step="0.01" placeholder="499">
    <label>Payment Method</label>
    <select id="payment"><option>bKash</option><option>Nagad</option><option>Bank Transfer</option><option>Cash</option><option>Other</option></select>
    <label>Payment Reference / Transaction ID</label><input id="txn" placeholder="Optional">
    <label>Status</label>
    <select id="status"><option>PAID</option><option>PENDING</option><option>REFUNDED</option></select>
    <label>Notes</label><textarea id="notes" placeholder="Thank you for your purchase!"></textarea>

    <button class="primary" onclick="generate()">Generate Receipt</button>
    <div class="actions">
      <button class="secondary" onclick="window.print()">Print / Save PDF</button>
      <button class="danger" onclick="clearForm()">Clear</button>
    </div>
  </div>

  <div class="card">
    <div id="preview" class="receipt">
      <div class="empty">Fill in the order details and tap <b>Generate Receipt</b>.</div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
$("date").value=new Date().toISOString().slice(0,10);

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function money(v){return "৳ "+Number(v||0).toLocaleString("en-BD",{minimumFractionDigits:2,maximumFractionDigits:2})}

function generate(){
 const order=$("order").value.trim()||"GW-"+Date.now().toString().slice(-6);
 const date=$("date").value||new Date().toISOString().slice(0,10);
 const customer=$("customer").value.trim()||"Customer";
 const email=$("email").value.trim();
 const product=$("product").value.trim()||"Game Purchase";
 const platform=$("platform").value.trim()||"—";
 const price=$("price").value||0;
 const payment=$("payment").value;
 const txn=$("txn").value.trim()||"—";
 const status=$("status").value;
 const notes=$("notes").value.trim()||"Thank you for your purchase!";

 $("preview").innerHTML=`
  <div class="brand">
    <div><div class="logo">GAMEWALA</div><div class="tag">PLAY MORE. PAY LESS.</div></div>
    <div class="meta"><b>RECEIPT</b><br>${esc(order)}<br>${esc(date)}</div>
  </div>
  <div class="title">PURCHASE RECEIPT</div>
  <div class="row"><span>Customer</span><strong>${esc(customer)}</strong></div>
  <div class="row"><span>Email</span><strong>${esc(email||"—")}</strong></div>
  <div class="row"><span>Product / Game</span><strong>${esc(product)}</strong></div>
  <div class="row"><span>Platform</span><strong>${esc(platform)}</strong></div>
  <div class="row"><span>Payment Method</span><strong>${esc(payment)}</strong></div>
  <div class="row"><span>Transaction ID</span><strong>${esc(txn)}</strong></div>
  <div class="row"><span>Payment Status</span><strong>${esc(status)}</strong></div>
  <div class="row total"><span>TOTAL</span><strong>${money(price)}</strong></div>
  <div class="note">${esc(notes)}</div>
  <div class="footer">Gamewala • Trusted Gaming Store<br>WhatsApp: 01805624866 • 24/7 Customer Support</div>
 `;
}

function clearForm(){
 ["order","customer","email","product","platform","price","txn","notes"].forEach(id=>$(id).value="");
 $("date").value=new Date().toISOString().slice(0,10);
 $("payment").value="bKash"; $("status").value="PAID";
 $("preview").innerHTML='<div class="empty">Fill in the order details and tap <b>Generate Receipt</b>.</div>';
}
</script>
</body>
</html>
